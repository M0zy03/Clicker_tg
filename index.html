<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #000;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', monospace;
  color: #b7c9a9;
}

/* ПИКСЕЛЬНОЕ СКРУГЛЕНИЕ УГЛОВ */
.box {
  --border: 2px;
  --step: 5px;
  --corner: 15px;
  --line: #7f8f6f;

  position: relative;
  border: none;
  clip-path: polygon(
    0 var(--corner),
    var(--step) var(--corner),
    var(--step) calc(var(--corner) - var(--step)),
    calc(var(--corner) - var(--step)) calc(var(--corner) - var(--step)),
    calc(var(--corner) - var(--step)) var(--step),
    var(--corner) var(--step),
    var(--corner) 0,

    calc(100% - var(--corner)) 0,
    calc(100% - var(--corner)) var(--step),
    calc(100% - var(--corner) + var(--step)) var(--step),
    calc(100% - var(--corner) + var(--step)) calc(var(--corner) - var(--step)),
    calc(100% - var(--step)) calc(var(--corner) - var(--step)),
    calc(100% - var(--step)) var(--corner),
    100% var(--corner),

    100% calc(100% - var(--corner)),
    calc(100% - var(--step)) calc(100% - var(--corner)),
    calc(100% - var(--step)) calc(100% - var(--corner) + var(--step)),
    calc(100% - var(--corner) + var(--step)) calc(100% - var(--corner) + var(--step)),
    calc(100% - var(--corner) + var(--step)) calc(100% - var(--step)),
    calc(100% - var(--corner)) calc(100% - var(--step)),
    calc(100% - var(--corner)) 100%,

    var(--corner) 100%,
    var(--corner) calc(100% - var(--step)),
    calc(var(--corner) - var(--step)) calc(100% - var(--step)),
    calc(var(--corner) - var(--step)) calc(100% - var(--corner) + var(--step)),
    var(--step) calc(100% - var(--corner) + var(--step)),
    var(--step) calc(100% - var(--corner)),
    0 calc(100% - var(--corner))
  );
}

.box::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: var(--line);
  clip-path: inherit;
  padding: var(--border);

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

/* ОСНОВА */
#app {
  --step: 5px;
  --corner: 18px;

  width: 420px;
  height: 90vh;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: #000;
}

/* ВЕРХ */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.label {
  font-size: 10px;
  opacity: 0.7;
}

.value {
  font-size: 22px;
  margin-top: 5px;
}

/* НАСТРОЙКИ */
.settings {
  --step: 4px;
  --corner: 12px;

  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.settings img {
  width: 62px;
}

/* ЭКРАН */
.screen {
  --step: 5px;
  --corner: 16px;

  flex: 1;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: url("bg_main.png") center/cover no-repeat;
}

/* ПРОГРЕСС */
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress {
  flex: 1;
  height: 14px;
  border: 2px solid #7f8f6f;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #b7c9a9;
}

.progress-text {
  font-size: 12px;
}

/* ЦЕНТР */
.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* КЛИКЕР */
#clicker {
  width: 220px;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* МОНЕТА */
#coin {
  width: 130%;
  object-fit: contain;
  pointer-events: none;
}

#clicker:active #coin {
  transform: scale(0.92);
}

/* +1 */
.plus {
  position: absolute;
  font-size: 14px;
  color: #b7c9a9;
  animation: floatUp 0.6s forwards;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0);
  }

  100% {
    opacity: 0;
    transform: translateY(-40px);
  }
}

/* НИЗ */
.bottom {
  display: flex;
  gap: 10px;
}

.menu-btn {
  --step: 4px;
  --corner: 12px;

  flex: 1;
  height: 70px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.menu-btn img {
  width: 70%;
}
</style>
</head>

<body>

<div id="app" class="box">

  <div class="top">

    <div>
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div style="text-align:center;">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>

    <div class="settings box">
      <img src="settings.png">
    </div>

  </div>

  <div class="screen box">

    <div class="label">NEXT BACKGROUND</div>

    <div class="progress-row">
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 100</div>
    </div>

    <div class="center">
      <div id="clicker">
        <img src="button.png" id="coin">
      </div>
    </div>

  </div>

  <div class="bottom">

    <div class="menu-btn box">
      <img src="upgrade.png">
    </div>

    <div class="menu-btn box">
      <img src="stats.png">
    </div>

    <div class="menu-btn box">
      <img src="trophy.png">
    </div>

  </div>

</div>

<script>
let score = 0;
let best = 0;

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const progressText = document.getElementById("progressText");

function updateProgress() {
  let progress = score % 100;
  document.getElementById("progress").style.width = progress + "%";
  progressText.innerText = progress + " / 100";
}

function createPlus(x, y) {
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";

  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  e.preventDefault();

  score++;
  scoreEl.innerText = score;

  if (score > best) {
    best = score;
    bestEl.innerText = best;
  }

  updateProgress();
  createPlus(e.clientX, e.clientY);
});

Telegram.WebApp.expand();
</script>

</body>
</html>
