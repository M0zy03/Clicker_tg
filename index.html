<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  font-family: 'Press Start 2P', monospace;
  color: #b7c9a9;

  background: url("bg_main.png") center/cover no-repeat;
}

/* шум */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("noise.png");
  opacity: 0.05;
  pointer-events: none;
}

/* основной блок */
#game {
  width: 100%;
  max-width: 420px;
  height: 90vh;

  border: 4px solid #6f7f5f;
  border-radius: 16px;
  background: rgba(0,0,0,0.7);

  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 20px;
  position: relative;
}

/* 🔥 BEST ПО ЦЕНТРУ */
.best-center {
  text-align: center;
}

.best-center .label {
  font-size: 10px;
  opacity: 0.7;
}

.best-center .value {
  font-size: 22px;
  margin-top: 5px;
}

/* ⚙️ настройки */
.settings {
  position: absolute;
  top: 15px;
  right: 15px;

  width: 40px;
  height: 40px;

  border: 2px solid #6f7f5f;
  border-radius: 10px;

  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🔥 сюда вставишь шестерёнку */
.settings img {
  width: 24px;
  height: 24px;
}

/* прогресс */
.progress-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress {
  flex: 1;
  border: 2px solid #6f7f5f;
  border-radius: 10px;
  height: 18px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #b7c9a9;
}

/* 🔥 УВЕЛИЧЕННЫЙ СЧЁТ */
.progress-text {
  font-size: 16px; /* увеличили */
  min-width: 80px;
  text-align: right;
}

/* центр */
.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#clicker {
  width: 220px;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* монета */
#coin {
  max-width: 185%;
  max-height: 185%;
  object-fit: contain;
  pointer-events: none;
}

#clicker:active #coin {
  transform: scale(0.9);
}

/* низ */
.bottom-menu {
  display: flex;
  gap: 10px;
}

.menu-btn {
  flex: 1;
  height: 70px;

  border: 2px solid #6f7f5f;
  border-radius: 12px;

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

.menu-btn img {
  max-width: 170%;
  max-height: 170%;
}

/* +1 */
.plus {
  position: absolute;
  font-size: 14px;
  color: #b7c9a9;
  animation: floatUp 0.6s forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}
</style>
</head>

<body>

<div id="game">

  <!-- ⚙️ настройки -->
  <div class="settings">
    <img src="settings.png"> <!-- 🔥 сюда шестерёнку -->
  </div>

  <!-- BEST -->
  <div class="best-center">
    <div class="label">BEST</div>
    <div class="value" id="best">0</div>
  </div>

  <!-- ПРОГРЕСС -->
  <div class="progress-wrapper">
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 100</div>
  </div>

  <!-- центр -->
  <div class="center">
    <div id="clicker">
      <img src="button.png" id="coin">
    </div>
  </div>

  <!-- низ -->
  <div class="bottom-menu">

    <div class="menu-btn">
      <img src="upgrade.png">
    </div>

    <div class="menu-btn">
      <img src="stats.png">
    </div>

    <div class="menu-btn">
      <img src="trophy.png">
    </div>

  </div>

</div>

<script>
let score = 0;
let best = 0;

const bestEl = document.getElementById("best");
const progressText = document.getElementById("progressText");

function updateProgress() {
  let progress = score % 100;

  document.getElementById("progress").style.width = progress + "%";
  progressText.innerText = progress + " / 100";
}

function createPlus(x, y) {
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";

  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  e.preventDefault();

  score++;

  if (score > best) {
    best = score;
    bestEl.innerText = best;
  }

  updateProgress();
  createPlus(e.clientX, e.clientY);
});

Telegram.WebApp.expand();
</script>

</body>
</html>
