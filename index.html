<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Press Start 2P';
  color:#b7c9a9;
}

.box{
  border:2px solid #7f8f6f;
  border-radius:8px;
  box-shadow: inset 0 0 0 1px rgba(183,201,169,0.15);
}

#app{
  width:420px;
  height:90vh;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.top{display:flex;justify-content:space-between;align-items:center;}
.label{font-size:10px;opacity:0.7;}
.value{font-size:22px;margin-top:5px;}

.settings{width:45px;height:45px;display:flex;justify-content:center;align-items:center;cursor:pointer;}
.settings img{width:62px;}

.screen{
  flex:1;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
  background:url("bg_main.png") center/cover no-repeat;
}

.progress-row{display:flex;gap:10px;align-items:center;}

.progress{
  flex:1;height:14px;
  border:2px solid #7f8f6f;
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{height:100%;width:0%;background:#b7c9a9;}
.progress-text{font-size:12px;}

.center{flex:1;display:flex;justify-content:center;align-items:center;}

#clicker{
  width:220px;height:220px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

#coin{
  width:130%;
  transition:transform 0.08s;
  pointer-events:none;
}

.click-anim{transform:scale(0.85);}

.bottom{display:flex;gap:10px;}

.menu-btn{
  flex:1;height:70px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

.menu-btn img{width:70%;}

/* МОДАЛКИ */
.modal{
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  background:rgba(0,0,0,0);
  opacity:0;pointer-events:none;
  transition:0.25s;
}

.modal.active{
  opacity:1;
  background:rgba(0,0,0,0.85);
  pointer-events:auto;
}

.modal-box{
  width:320px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
  transform:scale(0.8);
  opacity:0;
  transition:0.25s;
}

.modal.active .modal-box{
  transform:scale(1);
  opacity:1;
}

/* ПРОКАЧКА */
.upgrade-item{
  border:2px solid #7f8f6f;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.up-left{display:flex;flex-direction:column;gap:5px;}
.up-right{display:flex;flex-direction:column;align-items:center;gap:5px;}

.small{font-size:10px;opacity:0.6;}

.switch{
  width:50px;height:25px;
  border:2px solid #7f8f6f;
  position:relative;
  cursor:pointer;
}

.switch::after{
  content:"";
  width:20px;height:20px;
  background:#b7c9a9;
  position:absolute;
  top:1px;left:1px;
  transition:0.2s;
}

.switch.active::after{left:25px;}

.btn{cursor:pointer;}

/* ПОЛЗУНОК */
.range-wrapper{position:relative;height:14px;}
.range-fill{
  position:absolute;height:100%;
  background:#b7c9a9;
  width:100%;
  pointer-events:none;
}
input[type=range]{
  width:100%;
  height:14px;
  background:#111;
  border:2px solid #7f8f6f;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;
  background:#b7c9a9;
  border:2px solid #7f8f6f;
}
</style>
</head>

<body>

<div id="app" class="box">

<div class="top">
  <div>
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div style="text-align:center;">
    <div class="label">BEST</div>
    <div class="value" id="best">0</div>
  </div>

  <div class="settings box" id="openSettings">
    <img src="settings.png">
  </div>
</div>

<div class="screen box">
  <div class="label">NEXT BACKGROUND</div>

  <div class="progress-row">
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 100</div>
  </div>

  <div class="center">
    <div id="clicker">
      <img src="button.png" id="coin">
    </div>
  </div>
</div>

<div class="bottom">
  <div class="menu-btn box" id="openUpgrade"><img src="upgrade.png"></div>
  <div class="menu-btn box"><img src="stats.png"></div>
  <div class="menu-btn box"><img src="trophy.png"></div>
</div>

</div>

<!-- НАСТРОЙКИ -->
<div class="modal" id="settingsModal">
  <div class="modal-box box">
    <div>VOLUME</div>
    <div class="range-wrapper">
      <div class="range-fill" id="volumeFill"></div>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <div id="closeSettings" style="cursor:pointer;text-align:center;">CLOSE</div>
  </div>
</div>

<!-- МАГАЗИН -->
<div class="modal" id="upgradeModal">
  <div class="modal-box box">

    <!-- АВТОКЛИКЕР -->
    <div class="upgrade-item" id="autoClicker">
      <div class="up-left">
        AUTO CLICKER
        <div class="small" id="autoInfo">LVL 0 (0 cps)</div>
      </div>
      <div class="up-right" id="autoRight"></div>
    </div>

    <!-- СИЛА КЛИКА -->
    <div class="upgrade-item" id="clickPower">
      <div class="up-left">
        CLICK POWER
        <div class="small" id="clickInfo">LVL 0 (+1)</div>
      </div>
      <div class="up-right" id="clickRight"></div>
    </div>

    <div id="closeUpgrade" style="cursor:pointer;text-align:center;">CLOSE</div>
  </div>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<script>
let score=0,best=0,volume=1;

let autoLevel=0,autoActive=false;
let clickLevel=0,clickValue=1;

const levels=[
{price:150,value:1},
{price:500,value:3},
{price:1000,value:7},
{price:2000,value:15},
{price:5000,value:40}
];

/* КЛИК */
clicker.onclick=()=>{
  coin.classList.add("click-anim");
  setTimeout(()=>coin.classList.remove("click-anim"),80);

  clickSound.currentTime=0;
  clickSound.volume=volume;
  clickSound.play();

  score+=clickValue;
  updateUI();
};

/* АВТОКЛИК */
setInterval(()=>{
  if(autoActive && autoLevel>0){
    score+=levels[autoLevel-1].value;
    updateUI();
  }
},1000);

/* UI */
function updateUI(){
  scoreEl.innerText=score;

  if(score>best){
    best=score;
    bestEl.innerText=best;
  }

  let p=score%100;
  progress.style.width=p+"%";
  progressText.innerText=p+" / 100";

  updateShopUI();
}

/* SHOP */
function updateShopUI(){

  let autoVal = autoLevel>0 ? levels[autoLevel-1].value : 0;
  autoInfo.innerText=`LVL ${autoLevel} (${autoVal} cps)`;

  if(autoLevel===0){
    autoRight.innerHTML=`<div class="btn">BUY</div><div class="small">${levels[0].price}</div>`;
  }else{
    let next=levels[autoLevel];
    autoRight.innerHTML=`
      <div class="switch ${autoActive?"active":""}" id="autoToggle"></div>
      ${next ? `<div class="btn" id="autoUp">UPGRADE</div><div class="small">${next.price}</div>` : `<div class="small">MAX</div>`}
    `;

    autoToggle.onclick=(e)=>{e.stopPropagation();autoActive=!autoActive;updateShopUI();};

    if(next){
      autoUp.onclick=(e)=>{
        e.stopPropagation();
        if(score>=next.price){
          score-=next.price;
          autoLevel++;
          updateUI();
        }
      };
    }
  }

  let clickVal = clickLevel>0 ? levels[clickLevel-1].value : 1;
  clickInfo.innerText=`LVL ${clickLevel} (+${clickVal})`;

  if(clickLevel===0){
    clickRight.innerHTML=`<div class="btn">BUY</div><div class="small">${levels[0].price}</div>`;
  }else{
    let next=levels[clickLevel];
    clickRight.innerHTML=`
      ${next ? `<div class="btn" id="clickUp">UPGRADE</div><div class="small">${next.price}</div>` : `<div class="small">MAX</div>`}
    `;

    if(next){
      clickUp.onclick=(e)=>{
        e.stopPropagation();
        if(score>=next.price){
          score-=next.price;
          clickLevel++;
          clickValue=levels[clickLevel-1].value;
          updateUI();
        }
      };
    }
  }
}

/* ПОКУПКА */
autoClicker.onclick=()=>{
  if(autoLevel===0 && score>=levels[0].price){
    score-=levels[0].price;
    autoLevel=1;
    updateUI();
  }
};

clickPower.onclick=()=>{
  if(clickLevel===0 && score>=levels[0].price){
    score-=levels[0].price;
    clickLevel=1;
    clickValue=levels[0].value;
    updateUI();
  }
};

/* ГРОМКОСТЬ */
volumeSlider.oninput=(e)=>{
  volume=parseFloat(e.target.value);
  volumeFill.style.width=(volume*100)+"%";
};

/* МОДАЛКИ */
openSettings.onclick=()=>settingsModal.classList.add("active");
closeSettings.onclick=()=>settingsModal.classList.remove("active");

openUpgrade.onclick=()=>upgradeModal.classList.add("active");
closeUpgrade.onclick=()=>upgradeModal.classList.remove("active");

/* ссылки */
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const progress=document.getElementById("progress");
const progressText=document.getElementById("progressText");

Telegram.WebApp.expand();
</script>

</body>
</html>
