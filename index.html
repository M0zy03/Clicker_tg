<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  font-family: 'Press Start 2P', monospace;
  color: #b7c9a9;

  /* 🔥 ФОН */
  background: url("bg_main.png") center/cover no-repeat;
}

/* ШУМ */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("noise.png"); /* 🔥 шум */
  opacity: 0.05;
  pointer-events: none;
}

/* ОСНОВА */
#game {
  width: 100%;
  max-width: 420px;
  height: 90vh;

  border: 4px solid #6f7f5f;
  background: rgba(0,0,0,0.7);

  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 20px;
}

/* ВЕРХ */
.top-bar {
  display: flex;
  justify-content: space-between;
}

.label {
  font-size: 10px;
  opacity: 0.7;
}

.value {
  font-size: 22px;
  margin-top: 8px;
}

/* ПРОГРЕСС */
.progress {
  border: 2px solid #6f7f5f;
  height: 18px;
  width: 100%;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #b7c9a9;
}

/* ЦЕНТР */
.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#clicker {
  width: 220px;
  height: 220px;

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;
}

/* ✅ ПРАВИЛЬНОЕ ОТОБРАЖЕНИЕ МОНЕТЫ */
#coin {
  max-width: 100%;
  max-height: 100%;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* эффект нажатия */
#clicker:active #coin {
  transform: scale(0.9);
}

/* НИЖНЕЕ МЕНЮ */
.bottom-menu {
  display: flex;
  gap: 10px;
}

.menu-btn {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;

  border: 2px solid #6f7f5f;
  padding: 15px 0;
}

/* 🔥 ИКОНКИ */
.menu-btn img {
  width: 28px;
  height: 28px;
}

/* +1 */
.plus {
  position: absolute;
  font-size: 14px;
  color: #b7c9a9;
  animation: floatUp 0.6s forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}
</style>
</head>

<body>

<div id="game">

  <!-- ВЕРХ -->
  <div class="top-bar">
    <div>
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div>
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>
  </div>

  <!-- ПРОГРЕСС -->
  <div class="progress">
    <div class="progress-fill" id="progress"></div>
  </div>

  <!-- ЦЕНТР -->
  <div class="center">
    <div id="clicker">
      <!-- 🔥 ВСТАВЬ СЮДА МОНЕТКУ -->
      <img src="button.png" id="coin">
    </div>
  </div>

  <!-- НИЗ -->
  <div class="bottom-menu">

    <div class="menu-btn">
      <!-- 🔥 ИКОНКА 1 -->
      <img src="upgrade.png">
    </div>

    <div class="menu-btn">
      <!-- 🔥 ИКОНКА 2 -->
      <img src="stats.png">
    </div>

    <div class="menu-btn">
      <!-- 🔥 ИКОНКА 3 -->
      <img src="trophy.png">
    </div>

  </div>

</div>

<script>
let score = 0;
let best = 0;

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

function updateProgress() {
  let progress = score % 100;
  document.getElementById("progress").style.width = progress + "%";
}

function createPlus(x, y) {
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";

  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

/* ТАП */
document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  e.preventDefault();

  score++;
  scoreEl.innerText = score;

  if (score > best) {
    best = score;
    bestEl.innerText = best;
  }

  updateProgress();
  createPlus(e.clientX, e.clientY);
});

Telegram.WebApp.expand();
</script>

</body>
</html>
