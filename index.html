<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Press Start 2P', monospace;
  color:#b7c9a9;
}

.box {
  border:2px solid #7f8f6f;
  border-radius:8px;
  box-shadow: inset 0 0 0 1px rgba(183,201,169,0.15);
}

#app {
  width:420px;
  height:90vh;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.top { display:flex; justify-content:space-between; align-items:center; }

.label { font-size:10px; opacity:0.7; }
.value { font-size:22px; margin-top:5px; }

.settings {
  width:45px;
  height:45px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
.settings img { width:62px; }

.screen {
  flex:1;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
  background:url("bg_main.png") center/cover no-repeat;
}

.progress-row { display:flex; align-items:center; gap:10px; }

.progress {
  flex:1;
  height:14px;
  border:2px solid #7f8f6f;
  border-radius:6px;
  overflow:hidden;
}

.progress-fill { height:100%; width:0%; background:#b7c9a9; }
.progress-text { font-size:12px; }

.center { flex:1; display:flex; justify-content:center; align-items:center; }

#clicker {
  width:220px;
  height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

#coin {
  width:130%;
  transition: transform 0.08s ease;
  pointer-events:none;
}

.click-anim { transform:scale(0.85); }

.bottom { display:flex; gap:10px; }

.menu-btn {
  flex:1;
  height:70px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
.menu-btn img { width:70%; }

/* 🔥 АНИМАЦИЯ МОДАЛОК */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0);
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition: opacity 0.25s ease, background 0.25s ease;
}

.modal.active {
  opacity:1;
  pointer-events:auto;
  background:rgba(0,0,0,0.85);
}

.modal-box {
  width:320px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;

  transform: scale(0.8) translateY(20px);
  opacity:0;
  transition: all 0.25s ease;
}

.modal.active .modal-box {
  transform: scale(1) translateY(0);
  opacity:1;
}

/* остальное без изменений */
.upgrade-item {
  border:2px solid #7f8f6f;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.locked { opacity:0.4; }

.switch {
  width:50px;
  height:25px;
  border:2px solid #7f8f6f;
  position:relative;
  cursor:pointer;
}

.switch::after {
  content:"";
  width:20px;
  height:20px;
  background:#b7c9a9;
  position:absolute;
  top:1px;
  left:1px;
  transition:0.2s;
}

.switch.active::after { left:25px; }

.range-wrapper { position:relative; height:14px; }

.range-fill {
  position:absolute;
  top:0;
  left:0;
  height:100%;
  background:#b7c9a9;
  border-radius:4px;
}

input[type=range] {
  -webkit-appearance:none;
  width:100%;
  height:14px;
  background:#111;
  border:2px solid #7f8f6f;
  border-radius:4px;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:18px;
  height:18px;
  background:#b7c9a9;
  border:2px solid #7f8f6f;
  border-radius:4px;
}
</style>
</head>

<body>

<div id="app" class="box">

<div class="top">
  <div>
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div style="text-align:center;">
    <div class="label">BEST</div>
    <div class="value" id="best">0</div>
  </div>

  <div class="settings box" id="openSettings">
    <img src="settings.png">
  </div>
</div>

<div class="screen box">

  <div class="label">NEXT BACKGROUND</div>

  <div class="progress-row">
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 100</div>
  </div>

  <div class="center">
    <div id="clicker">
      <img src="button.png" id="coin">
    </div>
  </div>

</div>

<div class="bottom">
  <div class="menu-btn box" id="openUpgrade"><img src="upgrade.png"></div>
  <div class="menu-btn box"><img src="stats.png"></div>
  <div class="menu-btn box"><img src="trophy.png"></div>
</div>

</div>

<!-- НАСТРОЙКИ -->
<div class="modal" id="settingsModal">
  <div class="modal-box box">

    <div>
      <div style="margin-bottom:10px;">VOLUME</div>

      <div class="range-wrapper">
        <div class="range-fill" id="volumeFill"></div>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <div id="closeSettings" style="text-align:center;cursor:pointer;">
      CLOSE
    </div>

  </div>
</div>

<!-- ПРОКАЧКА -->
<div class="modal" id="upgradeModal">
  <div class="modal-box box">

    <div id="autoClicker" class="upgrade-item locked">
      <span>AUTO CLICKER (150)</span>
      <div class="switch" id="autoToggle"></div>
    </div>

    <div id="closeUpgrade" style="text-align:center;cursor:pointer;">
      CLOSE
    </div>

  </div>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<script>
/* только анимация открытия/закрытия */
openSettings.onclick = ()=> settingsModal.classList.add("active");
closeSettings.onclick = ()=> settingsModal.classList.remove("active");

openUpgrade.onclick = ()=> upgradeModal.classList.add("active");
closeUpgrade.onclick = ()=> upgradeModal.classList.remove("active");

Telegram.WebApp.expand();
</script>

</body>
</html>
