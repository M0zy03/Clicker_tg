<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #000;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', monospace;
  color: #b7c9a9;
}

.box {
  border: 2px solid #7f8f6f;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px rgba(183, 201, 169, 0.15);
}

#app {
  width: 420px;
  height: 90vh;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.label { font-size: 10px; opacity: 0.7; }
.value { font-size: 22px; margin-top: 5px; }

.settings {
  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
.settings img { width: 62px; }

.screen {
  flex: 1;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background: url("bg_main.png") center/cover no-repeat;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress {
  flex: 1;
  height: 14px;
  border: 2px solid #7f8f6f;
  border-radius: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #b7c9a9;
}

.progress-text { font-size: 12px; }

.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#clicker {
  width: 220px;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

#coin {
  width: 130%;
  pointer-events: none;
}

#clicker:active #coin {
  transform: scale(0.92);
}

.plus {
  position: absolute;
  font-size: 14px;
  animation: floatUp 0.6s forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

.bottom {
  display: flex;
  gap: 10px;
}

.menu-btn {
  flex: 1;
  height: 70px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.menu-btn img { width: 70%; }

/* МОДАЛКА */
#settingsModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-box {
  width: 300px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* переключатель */
.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.switch {
  width: 50px;
  height: 25px;
  border: 2px solid #7f8f6f;
  position: relative;
  cursor: pointer;
}

.switch::after {
  content: "";
  width: 20px;
  height: 20px;
  background: #b7c9a9;
  position: absolute;
  top: 1px;
  left: 1px;
  transition: 0.2s;
}

.switch.active::after {
  left: 25px;
}

/* 🔥 КРАСИВЫЙ ПОЛЗУНОК */
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 6px;
  background: #222;
  border: 2px solid #7f8f6f;
  border-radius: 4px;
}

/* линия */
input[type=range]::-webkit-slider-runnable-track {
  height: 6px;
  background: #222;
}

/* кружок */
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: #b7c9a9;
  border: 2px solid #7f8f6f;
  cursor: pointer;
  margin-top: -5px;
}

.close-btn {
  text-align: center;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="app" class="box">

  <div class="top">
    <div>
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div style="text-align:center;">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>

    <div class="settings box" id="openSettings">
      <img src="settings.png">
    </div>
  </div>

  <div class="screen box">

    <div class="label">NEXT BACKGROUND</div>

    <div class="progress-row">
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 100</div>
    </div>

    <div class="center">
      <div id="clicker">
        <img src="button.png" id="coin">
      </div>
    </div>

  </div>

  <div class="bottom">
    <div class="menu-btn box"><img src="upgrade.png"></div>
    <div class="menu-btn box"><img src="stats.png"></div>
    <div class="menu-btn box"><img src="trophy.png"></div>
  </div>

</div>

<!-- НАСТРОЙКИ -->
<div id="settingsModal">
  <div class="modal-box box">

    <div class="toggle">
      <span>VIBRATION</span>
      <div class="switch active" id="vibrationToggle"></div>
    </div>

    <div>
      <div style="margin-bottom:10px;">VOLUME</div>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    </div>

    <div class="close-btn" id="closeSettings">CLOSE</div>

  </div>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<script>
let score = 0;
let best = 0;

let vibration = true;
let volume = 1;

const clickSound = document.getElementById("clickSound");

/* КЛИК */
document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  e.preventDefault();

  score++;
  document.getElementById("score").innerText = score;

  if (score > best) {
    best = score;
    document.getElementById("best").innerText = best;
  }

  /* 🔥 ВИБРАЦИЯ (Telegram FIX) */
  if (vibration) {
    if (Telegram.WebApp.HapticFeedback) {
      Telegram.WebApp.HapticFeedback.impactOccurred("medium");
    } else if (navigator.vibrate) {
      navigator.vibrate(15);
    }
  }

  /* 🔊 ЗВУК */
  clickSound.currentTime = 0;
  clickSound.volume = volume;
  clickSound.play();

  /* +1 */
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";
  el.style.left = e.clientX + "px";
  el.style.top = e.clientY + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);

  let progress = score % 100;
  document.getElementById("progress").style.width = progress + "%";
  document.getElementById("progressText").innerText = progress + " / 100";
});

/* НАСТРОЙКИ */
const modal = document.getElementById("settingsModal");

document.getElementById("openSettings").onclick = () => {
  modal.style.display = "flex";
};

document.getElementById("closeSettings").onclick = () => {
  modal.style.display = "none";
};

const toggle = document.getElementById("vibrationToggle");

toggle.onclick = () => {
  vibration = !vibration;
  toggle.classList.toggle("active");
};

document.getElementById("volume").oninput = (e) => {
  volume = parseFloat(e.target.value);
};

Telegram.WebApp.expand();
</script>

</body>
</html>
