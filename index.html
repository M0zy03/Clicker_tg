<script>
let score = 0;
let best = 0;
let volumeValue = 1; // 🔥 фикс конфликта

let clickPower = 1;

let autoLevel = 0;
let autoActive = false;

/* 🔥 ДОБАВИЛ ВСЕ ЭЛЕМЕНТЫ */
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const progressEl = document.getElementById("progress");
const progressText = document.getElementById("progressText");

const volumeInput = document.getElementById("volume");
const volumeFill = document.getElementById("volumeFill");

const autoLvl = document.getElementById("autoLvl");
const autoPower = document.getElementById("autoPower");

const powerLvl = document.getElementById("powerLvl");
const powerValue = document.getElementById("powerValue");

const coin = document.getElementById("coin");
const clickSound = document.getElementById("clickSound");

/* КЛИК */
clicker.onclick = () => {
  coin.classList.add("click-anim");
  setTimeout(()=>coin.classList.remove("click-anim"),80);

  clickSound.currentTime = 0;
  clickSound.volume = volumeValue;
  clickSound.play();

  score += clickPower;
  updateUI();
};

/* АВТОКЛИК */
setInterval(()=>{
  if(autoActive){
    score += autoLevel;
    updateUI();
  }
},1000);

/* UI */
function updateUI(){
  scoreEl.innerText = score;

  if(score>best){
    best=score;
    bestEl.innerText=best;
  }

  let p = score % 100;
  progressEl.style.width = p + "%";
  progressText.innerText = p + " / 100";

  autoLvl.innerText="LVL "+autoLevel;
  autoPower.innerText="+"+autoLevel+" CPS";

  powerLvl.innerText="LVL "+clickPower;
  powerValue.innerText="+"+clickPower+" / click";
}

/* АВТОКЛИКЕР */
autoBuy.onclick=()=>{
  let price = 150*(autoLevel+1);

  if(score>=price){
    score-=price;
    autoLevel++;

    autoBuy.innerText="UPGRADE ("+(150*(autoLevel+1))+")";
    autoToggle.style.display="block";
    updateUI();
  }
};

autoToggle.onclick=()=>{
  autoActive=!autoActive;
  autoToggle.classList.toggle("active");
};

/* СИЛА */
powerBuy.onclick=()=>{
  let price = 150*clickPower;

  if(score>=price){
    score-=price;
    clickPower++;

    powerBuy.innerText="UPGRADE ("+(150*clickPower)+")";
    updateUI();
  }
};

/* 🔥 ГРОМКОСТЬ (ПОЛНОСТЬЮ ПОЧИНЕНА) */
volumeInput.oninput = (e) => {
  volumeValue = parseFloat(e.target.value);
  volumeFill.style.width = (volumeValue * 100) + "%";
};

/* МОДАЛКИ */
openSettings.onclick=()=>settingsModal.style.display="flex";
closeSettings.onclick=()=>settingsModal.style.display="none";

openUpgrade.onclick=()=>upgradeModal.style.display="flex";
closeUpgrade.onclick=()=>upgradeModal.style.display="none";

Telegram.WebApp.expand();
</script>
