<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Press Start 2P';
  color:#b7c9a9;
}

.box{
  border:2px solid #7f8f6f;
  border-radius:8px;
  box-shadow: inset 0 0 0 1px rgba(183,201,169,0.15);
}

#app{
  width:420px;
  height:90vh;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.top{display:flex;justify-content:space-between;align-items:center;}
.label{font-size:10px;opacity:0.7;}
.value{font-size:22px;margin-top:5px;}

.settings{width:45px;height:45px;display:flex;justify-content:center;align-items:center;cursor:pointer;}
.settings img{width:62px;}

.screen{
  flex:1;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
  background:url("bg_main.png") center/cover no-repeat;
}

.progress-row{display:flex;gap:10px;align-items:center;}

.progress{
  flex:1;height:14px;
  border:2px solid #7f8f6f;
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{height:100%;width:0%;background:#b7c9a9;}
.progress-text{font-size:12px;}

.center{flex:1;display:flex;justify-content:center;align-items:center;}

#clicker{
  width:220px;height:220px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

#coin{
  width:130%;
  transition:transform 0.08s;
  pointer-events:none;
}

.click-anim{transform:scale(0.85);}

.bottom{display:flex;gap:10px;}

.menu-btn{
  flex:1;height:70px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

.menu-btn img{width:70%;}

/* МОДАЛКИ */
.modal{
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  background:rgba(0,0,0,0);
  opacity:0;pointer-events:none;
  transition:0.25s;
}

.modal.active{
  opacity:1;
  background:rgba(0,0,0,0.85);
  pointer-events:auto;
}

.modal-box{
  width:320px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
  transform:scale(0.8);
  opacity:0;
  transition:0.25s;
}

.modal.active .modal-box{
  transform:scale(1);
  opacity:1;
}

/* ПРОКАЧКА */
.upgrade-item{
  border:2px solid #7f8f6f;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.up-left{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.up-right{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

.small{font-size:10px;opacity:0.6;}

.switch{
  width:50px;height:25px;
  border:2px solid #7f8f6f;
  position:relative;
  cursor:pointer;
}

.switch::after{
  content:"";
  width:20px;height:20px;
  background:#b7c9a9;
  position:absolute;
  top:1px;left:1px;
  transition:0.2s;
}

.switch.active::after{left:25px;}

.btn{
  cursor:pointer;
}
</style>
</head>

<body>

<div id="app" class="box">

<div class="top">
  <div>
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div style="text-align:center;">
    <div class="label">BEST</div>
    <div class="value" id="best">0</div>
  </div>

  <div class="settings box" id="openSettings">
    <img src="settings.png">
  </div>
</div>

<div class="screen box">
  <div class="label">NEXT BACKGROUND</div>

  <div class="progress-row">
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 100</div>
  </div>

  <div class="center">
    <div id="clicker">
      <img src="button.png" id="coin">
    </div>
  </div>
</div>

<div class="bottom">
  <div class="menu-btn box" id="openUpgrade"><img src="upgrade.png"></div>
  <div class="menu-btn box"><img src="stats.png"></div>
  <div class="menu-btn box"><img src="trophy.png"></div>
</div>

</div>

<!-- МАГАЗИН -->
<div class="modal" id="upgradeModal">
  <div class="modal-box box">

    <!-- АВТОКЛИКЕР -->
    <div class="upgrade-item" id="autoClicker">

      <div class="up-left">
        AUTO CLICKER
        <div class="small" id="autoInfo">LVL 0 (0 cps)</div>
      </div>

      <div class="up-right" id="autoRight"></div>

    </div>

    <!-- СИЛА КЛИКА -->
    <div class="upgrade-item" id="clickPower">

      <div class="up-left">
        CLICK POWER
        <div class="small" id="clickInfo">LVL 0 (+1)</div>
      </div>

      <div class="up-right" id="clickRight"></div>

    </div>

    <div id="closeUpgrade" style="cursor:pointer;text-align:center;">CLOSE</div>

  </div>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<script>
let score=0,best=0,volume=1;

let autoLevel=0,autoActive=false;
let clickPowerLevel=0,clickValue=1;

const autoLevels=[
{price:150,cps:1},
{price:500,cps:3},
{price:1000,cps:7},
{price:2000,cps:15},
{price:5000,cps:40}
];

const clickLevels=[
{price:100,value:2},
{price:300,value:5},
{price:800,value:10},
{price:2000,value:25}
];

/* КЛИК */
clicker.onclick=()=>{
  coin.classList.add("click-anim");
  setTimeout(()=>coin.classList.remove("click-anim"),80);

  clickSound.currentTime=0;
  clickSound.volume=volume;
  clickSound.play();

  score+=clickValue;
  updateUI();
};

/* АВТОКЛИК */
setInterval(()=>{
  if(autoActive && autoLevel>0){
    score+=autoLevels[autoLevel-1].cps;
    updateUI();
  }
},1000);

/* UI */
function updateUI(){
  scoreEl.innerText=score;

  if(score>best){
    best=score;
    bestEl.innerText=best;
  }

  let p=score%100;
  progress.style.width=p+"%";
  progressText.innerText=p+" / 100";

  updateShopUI();
}

/* SHOP */
function updateShopUI(){

  /* авто */
  let cps = autoLevel>0 ? autoLevels[autoLevel-1].cps : 0;
  autoInfo.innerText = `LVL ${autoLevel} (${cps} cps)`;

  if(autoLevel===0){
    autoRight.innerHTML = `<div>${autoLevels[0].price}</div>`;
  }else{

    let next = autoLevels[autoLevel];

    autoRight.innerHTML = `
      <div class="switch ${autoActive?"active":""}" id="autoToggle"></div>
      ${next ? `<div class="btn" id="autoUpgrade">UPGRADE</div>
      <div class="small">${next.price}</div>` : `<div class="small">MAX</div>`}
    `;

    document.getElementById("autoToggle").onclick=(e)=>{
      e.stopPropagation();
      autoActive=!autoActive;
      updateShopUI();
    };

    if(next){
      document.getElementById("autoUpgrade").onclick=(e)=>{
        e.stopPropagation();
        if(score>=next.price){
          score-=next.price;
          autoLevel++;
          updateUI();
        }
      };
    }
  }

  /* клик */
  let val = clickPowerLevel>0 ? clickLevels[clickPowerLevel-1].value : 1;
  clickInfo.innerText = `LVL ${clickPowerLevel} (+${val})`;

  if(clickPowerLevel < clickLevels.length){
    let next = clickLevels[clickPowerLevel];

    clickRight.innerHTML = `
      <div class="btn" id="clickUpgrade">UPGRADE</div>
      <div class="small">${next.price}</div>
    `;

    document.getElementById("clickUpgrade").onclick=(e)=>{
      e.stopPropagation();
      if(score>=next.price){
        score-=next.price;
        clickPowerLevel++;
        clickValue=next.value;
        updateUI();
      }
    };

  }else{
    clickRight.innerHTML = `<div class="small">MAX</div>`;
  }
}

/* ПОКУПКА ПЕРВАЯ */
autoClicker.onclick=()=>{
  if(autoLevel===0 && score>=autoLevels[0].price){
    score-=autoLevels[0].price;
    autoLevel=1;
    updateUI();
  }
};

/* МОДАЛКА */
openUpgrade.onclick=()=>upgradeModal.classList.add("active");
closeUpgrade.onclick=()=>upgradeModal.classList.remove("active");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const progress=document.getElementById("progress");
const progressText=document.getElementById("progressText");

Telegram.WebApp.expand();
</script>

</body>
</html>
