<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #000;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', monospace;
  color: #b7c9a9;
}

/* 🔥 ПИКСЕЛЬНЫЕ УГЛЫ */
.pixel-box {
  position: relative;
  border: 3px solid #7f8f6f;
}

.pixel-box::before {
  content: "";
  position: absolute;
  inset: -3px;
  pointer-events: none;

  /* делаем ступенчатые углы */
  clip-path: polygon(
    0% 8px, 8px 0%, calc(100% - 8px) 0%, 100% 8px,
    100% calc(100% - 8px), calc(100% - 8px) 100%,
    8px 100%, 0% calc(100% - 8px)
  );

  border: 3px solid #7f8f6f;
}

/* ОСНОВА */
#app {
  width: 420px;
  height: 90vh;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ВЕРХ */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.score-block { text-align: left; }
.best-block { text-align: center; }

.label {
  font-size: 10px;
  opacity: 0.7;
}

.value {
  font-size: 22px;
  margin-top: 5px;
}

/* ⚙️ */
.settings {
  width: 45px;
  height: 45px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.settings img {
  width: 24px;
}

/* 🔥 ВНУТРЕННИЙ ЭКРАН */
.screen {
  flex: 1;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;

  background: url("bg_main.png") center/cover no-repeat;
}

/* NEXT */
.next-label {
  font-size: 10px;
}

/* ПРОГРЕСС */
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress {
  flex: 1;
  height: 14px;
  border: 2px solid #7f8f6f;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #b7c9a9;
}

.progress-text {
  font-size: 12px;
}

/* ЦЕНТР */
.center {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 🔥 КЛИКЕР */
#clicker {
  width: 220px;
  height: 220px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* 🔥 МОНЕТА 185% */
#coin {
  width: 150%;
  height: auto;
  object-fit: contain;
  pointer-events: none;
}

/* эффект */
#clicker:active #coin {
  transform: scale(0.92);
}

/* +1 */
.plus {
  position: absolute;
  font-size: 14px;
  color: #b7c9a9;
  animation: floatUp 0.6s forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* НИЗ */
.bottom {
  display: flex;
  gap: 10px;
}

.menu-btn {
  flex: 1;
  height: 70px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* 🔥 ИКОНКИ 170% */
.menu-btn img {
  width: 100%;
  height: auto;
  object-fit: contain;
}
</style>
</head>

<body>

<div id="app" class="pixel-box">

  <!-- ВЕРХ -->
  <div class="top">

    <div class="score-block">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="best-block">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>

    <div class="settings pixel-box">
      <img src="settings.png">
    </div>

  </div>

  <!-- ЭКРАН -->
  <div class="screen pixel-box">

    <div class="next-label">NEXT BACKGROUND</div>

    <div class="progress-row">
      <div class="progress">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 100</div>
    </div>

    <div class="center">
      <div id="clicker">
        <img src="button.png" id="coin">
      </div>
    </div>

  </div>

  <!-- НИЗ -->
  <div class="bottom">

    <div class="menu-btn pixel-box">
      <img src="upgrade.png">
    </div>

    <div class="menu-btn pixel-box">
      <img src="stats.png">
    </div>

    <div class="menu-btn pixel-box">
      <img src="trophy.png">
    </div>

  </div>

</div>

<script>
let score = 0;
let best = 0;

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const progressText = document.getElementById("progressText");

function updateProgress() {
  let progress = score % 100;
  document.getElementById("progress").style.width = progress + "%";
  progressText.innerText = progress + " / 100";
}

function createPlus(x, y) {
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";

  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  e.preventDefault();

  score++;
  scoreEl.innerText = score;

  if (score > best) {
    best = score;
    bestEl.innerText = best;
  }

  updateProgress();
  createPlus(e.clientX, e.clientY);
});

Telegram.WebApp.expand();
</script>

</body>
</html>
