<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ПИКСЕЛЬНЫЙ ШРИФТ -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: 'Press Start 2P', monospace;
  color: #b7c9a9;
  overflow: hidden;

  /* 🔥 ВСТАВЬ СЮДА ФОН (главный экран) */
  background: url("bg_main.png") center/cover no-repeat;
}

/* 🔥 ЭФФЕКТ ЗЕРНА (очень важно для ретро) */
body::after {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("noise.png"); /* ← сюда картинку шума */
  opacity: 0.05;
  pointer-events: none;
}

/* ОСНОВНАЯ РАМКА */
#game {
  width: 90%;
  max-width: 420px;
  margin: auto;
  margin-top: 20px;

  /* 🔥 РАМКА КАК В ИГРЕ */
  border: 4px solid #6f7f5f;
  padding: 20px;
  background: rgba(0,0,0,0.6);
}

/* ВЕРХ */
.top-bar {
  display: flex;
  justify-content: space-between;
}

.label {
  font-size: 10px;
}

.value {
  font-size: 20px;
  margin-top: 10px;
}

/* ПРОГРЕСС */
.progress {
  border: 2px solid #6f7f5f;
  height: 20px;
  margin: 20px 0;
  position: relative;
}

.progress-fill {
  background: #b7c9a9;
  height: 100%;
  width: 0%;
}

/* 🔥 КНОПКА (ВАЖНО) */
#clicker {
  width: 220px;
  height: 220px;
  margin: 30px auto;
  cursor: pointer;

  display: flex;
  justify-content: center;
  align-items: center;

  text-align: center;
  color: black;

  /* 🔥 ВСТАВЬ СВОЮ КНОПКУ */
  background: url("button.png") center/cover no-repeat;
}

/* эффект нажатия */
#clicker:active {
  transform: scale(0.95);
}

/* НИЖНЕЕ МЕНЮ */
.bottom-menu {
  display: flex;
  justify-content: space-between;
}

.menu-btn {
  width: 30%;
  text-align: center;
  padding: 10px;

  border: 2px solid #6f7f5f;
}

/* 🔥 ИКОНКИ */
.menu-btn img {
  width: 24px;
  display: block;
  margin: 0 auto 10px;
}

/* +1 */
.plus {
  position: absolute;
  color: #b7c9a9;
  font-size: 16px;
  animation: floatUp 0.6s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}
</style>
</head>

<body>

<div id="game">

  <!-- ВЕРХ -->
  <div class="top-bar">
    <div>
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div>
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>
  </div>

  <!-- ПРОГРЕСС -->
  <div class="progress">
    <div class="progress-fill" id="progress"></div>
  </div>

  <!-- КНОПКА -->
  <div id="clicker">
    CLICK<br>ME
  </div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="bottom-menu">

    <div class="menu-btn">
      <!-- 🔥 ИКОНКА -->
      <img src="upgrade.png">
      UPGRADES
    </div>

    <div class="menu-btn">
      <img src="stats.png">
      STATS
    </div>

    <div class="menu-btn">
      <img src="trophy.png">
      ACHIEVE
    </div>

  </div>

</div>

<script>
let score = 0;
let best = 0;

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

function updateProgress() {
  let progress = score % 100;
  document.getElementById("progress").style.width = progress + "%";
}

function createPlus(x, y) {
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";

  el.style.left = x + "px";
  el.style.top = y + "px";

  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

/* 🔥 ТАП (быстро для Telegram) */
document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  score++;
  scoreEl.innerText = score;

  if (score > best) {
    best = score;
    bestEl.innerText = best;
  }

  updateProgress();
  createPlus(e.clientX, e.clientY);
});

Telegram.WebApp.expand();
</script>

</body>
</html>
