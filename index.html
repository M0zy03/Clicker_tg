<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Press Start 2P';
  color:#b7c9a9;
}

.box{
  border:2px solid #7f8f6f;
  border-radius:8px;
  box-shadow: inset 0 0 0 1px rgba(183,201,169,0.15);
}

#app{
  width:420px;
  height:90vh;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.top{display:flex;justify-content:space-between;align-items:center;}

.label{font-size:10px;opacity:0.7;}
.value{font-size:22px;margin-top:5px;}

.settings{
  width:45px;height:45px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}
.settings img{width:62px;}

.screen{
  flex:1;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:15px;
  background:url("bg_main.png") center/cover no-repeat;
}

.progress-row{display:flex;gap:10px;align-items:center;}

.progress{
  flex:1;height:14px;
  border:2px solid #7f8f6f;
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{height:100%;width:0%;background:#b7c9a9;}
.progress-text{font-size:12px;}

.center{flex:1;display:flex;justify-content:center;align-items:center;}

#clicker{
  width:220px;height:220px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

#coin{
  width:130%;
  transition:transform 0.08s;
  pointer-events:none;
}

.click-anim{transform:scale(0.85);}

.bottom{display:flex;gap:10px;}

.menu-btn{
  flex:1;height:70px;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

.menu-btn img{width:70%;}

/* МОДАЛКИ */
.modal{
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  background:rgba(0,0,0,0);
  opacity:0;pointer-events:none;
  transition:0.25s;
}

.modal.active{
  opacity:1;
  background:rgba(0,0,0,0.85);
  pointer-events:auto;
}

.modal-box{
  width:320px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
  transform:scale(0.8);
  opacity:0;
  transition:0.25s;
}

.modal.active .modal-box{
  transform:scale(1);
  opacity:1;
}

/* ПОЛЗУНОК */
.range-wrapper{position:relative;height:14px;}

.range-fill{
  position:absolute;height:100%;
  background:#b7c9a9;
  border-radius:4px;
  width:100%;
}

input[type=range]{
  width:100%;
  height:14px;
  background:#111;
  border:2px solid #7f8f6f;
  border-radius:4px;
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;
  background:#b7c9a9;
  border:2px solid #7f8f6f;
}

/* ПРОКАЧКА */
.upgrade-item{
  border:2px solid #7f8f6f;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.locked{opacity:0.4;}

.switch{
  width:50px;height:25px;
  border:2px solid #7f8f6f;
  position:relative;
  cursor:pointer;
}

.switch::after{
  content:"";
  width:20px;height:20px;
  background:#b7c9a9;
  position:absolute;
  top:1px;left:1px;
  transition:0.2s;
}

.switch.active::after{left:25px;}
</style>
</head>

<body>

<div id="app" class="box">

<div class="top">
  <div>
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div style="text-align:center;">
    <div class="label">BEST</div>
    <div class="value" id="best">0</div>
  </div>

  <div class="settings box" id="openSettings">
    <img src="settings.png">
  </div>
</div>

<div class="screen box">

  <div class="label">NEXT BACKGROUND</div>

  <div class="progress-row">
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 100</div>
  </div>

  <div class="center">
    <div id="clicker">
      <img src="button.png" id="coin">
    </div>
  </div>

</div>

<div class="bottom">
  <div class="menu-btn box" id="openUpgrade"><img src="upgrade.png"></div>
  <div class="menu-btn box"><img src="stats.png"></div>
  <div class="menu-btn box"><img src="trophy.png"></div>
</div>

</div>

<!-- НАСТРОЙКИ -->
<div class="modal" id="settingsModal">
  <div class="modal-box box">

    <div>VOLUME</div>
    <div class="range-wrapper">
      <div class="range-fill" id="volumeFill"></div>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
    </div>

    <div id="closeSettings" style="cursor:pointer;text-align:center;">CLOSE</div>
  </div>
</div>

<!-- ПРОКАЧКА -->
<div class="modal" id="upgradeModal">
  <div class="modal-box box">

    <div id="autoClicker" class="upgrade-item locked">
      <div>
        AUTO CLICKER
        <div id="autoLevel">LVL 0</div>
      </div>
      <div class="switch" id="autoToggle"></div>
    </div>

    <div id="upgradeInfo" style="font-size:10px; opacity:0.6;"></div>

    <div id="buyUpgrade" style="cursor:pointer;text-align:center;">BUY</div>
    <div id="closeUpgrade" style="cursor:pointer;text-align:center;">CLOSE</div>

  </div>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<script>
let score=0,best=0,volume=1;
let autoLevel=0,autoActive=false;

const levels=[
{price:150,cps:1},
{price:500,cps:3},
{price:1000,cps:7},
{price:2000,cps:15},
{price:5000,cps:40}
];

const clickSound=document.getElementById("clickSound");

/* КЛИК */
clicker.addEventListener("pointerdown",(e)=>{
  e.preventDefault();

  coin.classList.add("click-anim");
  setTimeout(()=>coin.classList.remove("click-anim"),80);

  clickSound.currentTime=0;
  clickSound.volume=volume;
  clickSound.play();

  score++;
  updateUI();
});

/* АВТОКЛИК */
setInterval(()=>{
  if(autoActive && autoLevel>0){
    score+=levels[autoLevel-1].cps;
    updateUI();
  }
},1000);

/* UI */
function updateUI(){
  scoreEl.innerText=score;

  if(score>best){
    best=score;
    bestEl.innerText=best;
  }

  let p=score%100;
  progress.style.width=p+"%";
  progressText.innerText=p+" / 100";

  autoLevelEl.innerText="LVL "+autoLevel;

  if(score>=150) autoClicker.classList.remove("locked");

  updateUpgradeInfo();
}

function updateUpgradeInfo(){
  if(autoLevel>=levels.length){
    upgradeInfo.innerHTML="MAX LEVEL";
    return;
  }
  let n=levels[autoLevel];
  upgradeInfo.innerHTML=`PRICE: ${n.price} | CPS: ${n.cps}`;
}

/* ПОКУПКА */
buyUpgrade.onclick=()=>{
  if(autoLevel>=levels.length) return;

  let n=levels[autoLevel];
  if(score>=n.price){
    score-=n.price;
    autoLevel++;
    updateUI();
  }
};

/* TOGGLE */
autoToggle.onclick=(e)=>{
  e.stopPropagation();
  if(autoLevel===0) return;

  autoActive=!autoActive;
  autoToggle.classList.toggle("active");
};

/* ГРОМКОСТЬ */
volumeSlider.addEventListener("input",(e)=>{
  volume=parseFloat(e.target.value);
  volumeFill.style.width=(volume*100)+"%";
  clickSound.volume=volume;
});

/* МОДАЛКИ */
openSettings.onclick=()=>settingsModal.classList.add("active");
closeSettings.onclick=()=>settingsModal.classList.remove("active");

openUpgrade.onclick=()=>upgradeModal.classList.add("active");
closeUpgrade.onclick=()=>upgradeModal.classList.remove("active");

/* ссылки */
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const progress=document.getElementById("progress");
const progressText=document.getElementById("progressText");
const autoLevelEl=document.getElementById("autoLevel");

Telegram.WebApp.expand();
</script>

</body>
</html>
