<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;

  background: #000;
  background-size: cover;
  background-position: center;
  transition: background 0.5s;

  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;
}

#game {
  text-align: center;
}

#score {
  font-size: 70px;
  margin-bottom: 20px;
  color: black;
  transition: transform 0.1s;
}

#clicker {
  width: 220px;
  height: 220px;
  border-radius: 20px;
  cursor: pointer;
  -webkit-user-drag: none;
}

#clicker:active {
  transform: scale(0.85);
}

#effects {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}

.plus {
  position: absolute;
  font-size: 28px;
  font-weight: bold;
  color: #00ffcc;
  animation: floatUp 0.6s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
}

/* ОГРОМНОЕ 67 */
#bigEvent {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  font-size: 600px;
  font-weight: bold;
  color: gold;
  opacity: 0;
  pointer-events: none;
  text-shadow: 2px 2px 10px #000;
}

.show67 {
  animation: show67 3s ease-out;
}

@keyframes show67 {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
</style>
</head>

<body>

<div id="game">
  <div id="score">0</div>
  <img id="clicker" src="Image_1.jpg" draggable="false">
</div>

<div id="effects"></div>
<div id="bigEvent">67</div>

<!-- звук -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<!-- ВАЖНО: правильная ссылка GitHub -->
<audio id="achSound" src="https://raw.githubusercontent.com/M0zy03/Clicker_tg/main/six_seven.mp3"></audio>

<script>
let score = 0;
let lastBgIndex = -1;

const scoreEl = document.getElementById("score");
const effects = document.getElementById("effects");
const clickSound = document.getElementById("clickSound");
const achSound = document.getElementById("achSound");
const bigEvent = document.getElementById("bigEvent");

const backgrounds = [
  "bg1.jpg","bg2.jpg","bg3.jpg","bg4.jpg","bg5.jpg",
  "bg6.jpg","bg7.jpg","bg8.jpg","bg9.jpg","bg10.jpg",
  "bg11.jpg","bg12.jpg","bg13.jpg","bg14.jpg","bg15.jpg"
];

function updateBackground() {
  let index = Math.floor(score / 100);

  if (index !== lastBgIndex && index < backgrounds.length) {
    document.body.style.backgroundImage = `url(${backgrounds[index]})`;
    lastBgIndex = index;
  }
}

function check67() {
  if (score % 100 === 67) {
    bigEvent.classList.remove("show67");
    void bigEvent.offsetWidth;
    bigEvent.classList.add("show67");

    achSound.currentTime = 0;
    achSound.play();

    // вибрация
    if (Telegram.WebApp.HapticFeedback) {
      Telegram.WebApp.HapticFeedback.impactOccurred("heavy");
    }

    if (navigator.vibrate) {
      navigator.vibrate([200,100,200,100,800]); // лучше чем просто 3000
    }
  }
}

function createPlus(x, y) {
  const el = document.createElement("div");
  el.className = "plus";
  el.innerText = "+1";
  el.style.left = x + "px";
  el.style.top = y + "px";

  effects.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

// 🔥 БЫСТРЫЙ ТАП (вместо click)
document.getElementById("clicker").addEventListener("pointerdown", (e) => {
  e.preventDefault();

  score++;
  scoreEl.innerText = score;

  scoreEl.style.transform = "scale(1.2)";
  setTimeout(() => scoreEl.style.transform = "scale(1)", 80);

  createPlus(e.clientX, e.clientY);

  clickSound.currentTime = 0;
  clickSound.play();

  updateBackground();
  check67();
});

Telegram.WebApp.expand();
</script>

</body>
</html>
